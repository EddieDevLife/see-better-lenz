<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <!-- Matrizes Brettel/Viénot 1999 — simulação de dicromacia -->
    <filter id="lenz-protanopia-sim" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="
        0.567 0.433 0     0 0
        0.558 0.442 0     0 0
        0     0.242 0.758 0 0
        0     0     0     1 0"/>
    </filter>
    <filter id="lenz-deuteranopia-sim" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="
        0.625 0.375 0    0 0
        0.7   0.3   0    0 0
        0     0.3   0.7  0 0
        0     0     0    1 0"/>
    </filter>
    <filter id="lenz-tritanopia-sim" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="
        0.95  0.05  0     0 0
        0     0.433 0.567 0 0
        0     0.475 0.525 0 0
        0     0     0     1 0"/>
    </filter>

    <!-- Daltonização (correção) — desloca informação perdida para canais visíveis -->
    <filter id="lenz-deuteranopia-correct" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="
        0.8  0.2  0    0 0
        0.26 0.74 0    0 0
        0.26 0.14 0.6  0 0
        0    0    0    1 0"/>
      <feComponentTransfer>
        <feRGB-funcR/>
      </feComponentTransfer>
    </filter>
    <filter id="lenz-protanopia-correct" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="
        0.6  0.4  0    0 0
        0.3  0.7  0    0 0
        0.3  0.1  0.6  0 0
        0    0    0    1 0"/>
    </filter>
    <filter id="lenz-tritanopia-correct" color-interpolation-filters="linearRGB">
      <feColorMatrix type="matrix" values="
        0.95 0.05 0    0 0
        0    0.85 0.15 0 0
        0    0.3  0.7  0 0
        0    0    0    1 0"/>
    </filter>
  </defs>
</svg>
